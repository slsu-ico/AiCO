name: Standalone ICO Facebook chatbot
on:
  push:
    paths: ['ico-facebook-chatbot/**', '.github/workflows/ico-facebook-chatbot.yml']
  pull_request:
    paths: ['ico-facebook-chatbot/**', '.github/workflows/ico-facebook-chatbot.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: ico-facebook-chatbot
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ico-facebook-chatbot/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run ci
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t ico-facebook-chatbot .
